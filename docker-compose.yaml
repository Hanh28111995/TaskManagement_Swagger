services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: newjira-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: newjira-api
    depends_on:
      db:
        condition: service_healthy
    environment:    
      ASPNETCORE_ENVIRONMENT: "Development"
      ENV_LIST_PATH: "/config/env-list.json"
      GOOGLE_APPLICATION_CREDENTIALS: "/config/newjira-firebase-admin.json"      
      ConnectionStrings__DefaultConnection: "Server=db;Database=JiraDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True"    
    volumes:
      - "D:/Secrets/env-list.json:/config/env-list.json:ro"
      - "D:/Secrets/newjira-firebase-admin.json:/config/newjira-firebase-admin.json:ro"
    ports:
      - "8080:8080"

volumes:
  mssql-data: