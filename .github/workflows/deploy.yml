name: CI/CD NewJira

"on":
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore NewJira.slnx

      - name: Run Unit Tests
        run: dotnet test NewJira.UnitTests/NewJira.UnitTests.csproj --no-restore --verbosity minimal

      - name: Build solution
        run: dotnet build NewJira.slnx --no-restore --configuration Release

  build-and-deploy:
    runs-on: self-hosted
    needs: test

    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: '${{ secrets.DOCKERHUB_USERNAME }}'
          password: '${{ secrets.DOCKERHUB_TOKEN }}'

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: '${{ secrets.DOCKERHUB_USERNAME }}/newjira-api:latest'

      - name: Deploy to VPS via Docker Compose
        run: |
          cd /home/deployer/actions-runner/_work/TaskManagement_Swagger/TaskManagement_Swagger
          docker compose pull
          docker compose down
          docker compose up -d --remove-orphans
